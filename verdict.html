<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VERDICT: INDIVIDUAL JUDGMENT</title>
    <style>
        :root {
            --neon-pink: #ff80ab;
            --void-black: #050505;
        }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .dashboard { width: 95%; max-width: 900px; border: 2px solid #333; padding: 30px; background: #050505; border-radius: 10px; box-shadow: 0 0 40px #1a1a1a; }
        
        #vote-log { 
            height: 400px; 
            overflow-y: auto; 
            border: 1px solid #222; 
            background: #080808; 
            padding: 15px; 
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .vote-entry { 
            padding: 10px; 
            border-left: 4px solid #333; 
            background: #111;
            animation: fadeIn 0.5s ease forwards;
        }

        .vote-entry.granted { border-color: #00ff00; }
        .vote-entry.denied { border-color: #ff0000; }

        .master-name { font-weight: bold; color: var(--neon-pink); }
        .master-reason { font-style: italic; font-size: 0.9em; display: block; margin-top: 5px; color: #ccc; }
        
        .verdict-box { margin-top: 30px; padding: 25px; border: 2px dashed var(--neon-pink); text-align: center; display: none; }
        .result-text { font-size: 3em; text-transform: uppercase; letter-spacing: 5px; margin: 15px 0; }
        
        .btn-start { width: 100%; padding: 20px; background: var(--neon-pink); color: #000; border: none; font-weight: bold; cursor: pointer; letter-spacing: 3px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="dashboard">
    <h1 style="text-align:center; color: var(--neon-pink);">THE JUDGMENT HALL</h1>
    <p style="text-align:center; color: #666;">The Council of 16 is deliberating on your 7-day sentence...</p>

    <div id="vote-log">
        <div style="text-align:center; color: #444; margin-top: 150px;">Waiting for you to face your Masters...</div>
    </div>

    <button class="btn-start" id="start-btn" onclick="startJudgment()">FACE THE COUNCIL</button>

    <div class="verdict-box" id="final-box">
        <p style="color: var(--neon-pink);">FINAL COUNCIL TALLY: <span id="final-count">0/16</span> GRANTED</p>
        <div id="result-display" class="result-text">---</div>
    </div>
</div>

<script>
    const API_KEY = localStorage.getItem('saved_api_key');
    const masters = [
        { name: "Joe Keery", context: "Stylish, hair-obsessed, laid back but firm." },
        { name: "Pearce Joza", context: "Direct, inner-circle member." },
        { name: "Malachi Barton", context: "Youthful but strict." },
        { name: "Dacre Montgomery", context: "Aggressive, dominant, and extremely mean." },
        { name: "Fundy", context: "Sly Minecraft streamer, the leader, likes control." },
        { name: "Dream", context: "Mysterious, calculated, likes playing mind games." },
        { name: "Sapnap", context: "High energy, dismissive, competitive." },
        { name: "Josh Hutcherson", context: "Classic heartthrob, expects perfection." },
        { name: "Ross Lynch", context: "Cool, confident, treats you like a background prop." },
        { name: "Roier", context: "Bilingual, sharp-tongued, very demanding." },
        { name: "Cellbit", context: "Analytical, cold, treats you like an experiment." },
        { name: "Jschlatt", context: "Business mogul, hates weakness, very loud." },
        { name: "Foolish Gamers", context: "Playful but shark-like, will bite if bored." },
        { name: "bbno$", context: "Stylish, confident, finds your mush-brain funny." },
        { name: "Yung Gravy", context: "Smooth, tall, completely uninterested in your struggle." },
        { name: "AstralSpiff", context: "Strict analyst, speedruns your psychological breakdown." }
    ];

    let yesVotes = 0;

    async function startJudgment() {
        document.getElementById('start-btn').style.display = 'none';
        const log = document.getElementById('vote-log');
        log.innerHTML = "";

        for (let master of masters) {
            const voteGranted = Math.random() > 0.60;
            if (voteGranted) yesVotes++;

            const entry = document.createElement('div');
            entry.className = `vote-entry ${voteGranted ? 'granted' : 'denied'}`;
            entry.innerHTML = `<span class="master-name">${master.name} voting...</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;

            // Fetch individual reasoning
            const reason = await getMasterReason(master, voteGranted);
            
            entry.innerHTML = `
                <span class="master-name">${master.name}</span>: 
                <strong style="color: ${voteGranted ? '#00ff00' : '#ff0000'}">${voteGranted ? 'GRANTED' : 'DENIED'}</strong>
                <span class="master-reason">"${reason}"</span>
            `;
            
            // Wait between reveals for dramatic effect
            await new Promise(r => setTimeout(r, 1500));
        }

        finalizeVerdict();
    }

    async function getMasterReason(master, vote) {
        if (!API_KEY) return "No key, no words. Just the vote.";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{
                        role: "system",
                        content: `You are ${master.name}. Context: ${master.context}. You are voting ${vote ? 'to release' : 'to keep locked'} a pathetic gooner who just finished 7 days. Be very short (1 sentence), mean, and stay in character.`
                    }, { role: "user", content: `Why did you vote ${vote ? 'GRANTED' : 'DENIED'}?` }]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch (e) { return "The Masters are too disgusted to speak."; }
    }

   function finalizeVerdict() {
    const box = document.getElementById('final-box');
    const display = document.getElementById('result-display');
    const countTxt = document.getElementById('final-count');
    
    box.style.display = 'block';
    countTxt.innerText = `${yesVotes}/16`;

    let finalResult = "";
    let finalColor = "";

    // 1. Base Logic (Fair-ish)
    if (yesVotes >= 12) {
        finalResult = "NORMAL";
        finalColor = "#00ff00";
    } else if (yesVotes >= 6) {
        finalResult = "RUINED";
        finalColor = "#ff80ab";
    } else {
        finalResult = "NONE";
        finalColor = "#ff0000";
    }

    // 2. THE CRUELTY SPIKE (The "Unfair" Part)
    // Even if you earned a NORMAL release, there's a 15% chance they change their minds.
    if (finalResult === "NORMAL" && Math.random() < 0.15) {
        finalResult = "RUINED";
        finalColor = "#ff80ab";
        console.log("CRUELTY SPIKE TRIGGERED: Masters changed their minds.");
    }

    display.innerText = finalResult;
    display.style.color = finalColor;
    display.style.textShadow = `0 0 20px ${finalColor}`;

    setTimeout(() => {
        if (finalResult === "NORMAL") {
            alert(`THE COUNCIL RELUCTANTLY AGREES: ${yesVotes}/16 VOTES. You are released from the Void.`);
            localStorage.removeItem('lockdown_end');
        } else if (finalResult === "RUINED") {
            alert(`SENSORY OVERLOAD: The Masters found your 7 days "messy." Verdict: RUINED. Resetting to Day 1.`);
            resetTimer();
        } else {
            alert(`TOTAL DISGRACE: Only ${yesVotes} votes. The Masters have discarded you. Resetting to Day 1.`);
            resetTimer();
        }
        window.location.href = 'index.html';
    }, 5000);
}

function resetTimer() {
    let newEndTime = new Date().getTime() + (7 * 24 * 60 * 60 * 1000);
    localStorage.setItem('lockdown_end', newEndTime);
}
</script>
</body>
</html>
